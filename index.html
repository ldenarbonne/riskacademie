<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="RiskAcadémie : formation en risk management bancaire et financier par Laurent Motais de Narbonne — risque de marché, crédit et contrepartie, ALM et liquidité, réglementation, risque opérationnel, climat et ESG, risque de modèle.">
<meta name="author" content="Laurent Motais de Narbonne">
<meta property="og:title" content="RiskAcadémie — Formation en risk management">
<meta property="og:description" content="7 modules, 21 leçons, quiz corrigés et calculateurs interactifs, en français.">
<title>RiskAcadémie — Formation en risk management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202e; --ink2:#46505e; --mute:#6b7380; --line:#e1ddd4; --paper:#faf8f4; --card:#ffffff;
  --accent:#9a5b13; --accent-soft:#f4e9da; --ok:#2e7d4f; --ok-soft:#e3f1e8; --warn:#a86a00; --warn-soft:#fbefd6; --ko:#b03a2e; --ko-soft:#f8e1de;
  --mod:#1f4e79; --r:10px;
  --serif:"IBM Plex Serif", Georgia, serif; --sans:"IBM Plex Sans", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#ebe7df; --ink2:#c4bfb5; --mute:#9a958c; --line:#34383f; --paper:#16191e; --card:#1e2228; --accent:#e0a35a; --accent-soft:#3a2d1c;
    --ok:#6cc08e; --ok-soft:#1d3327; --warn:#e7b04f; --warn-soft:#3a2f17; --ko:#e8786c; --ko-soft:#3d2220; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:20px;height:60px}
.brand{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:.2px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand span{color:var(--accent)}
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.main a{text-decoration:none;color:var(--ink2);padding:6px 12px;border-radius:6px;font-size:14.5px;font-weight:500}
nav.main a:hover{background:var(--accent-soft);color:var(--ink)}
nav.main a.on{background:var(--ink);color:var(--paper)}
nav.main a.trainer{border:1px solid var(--line)}
main{padding:32px 0 80px;min-height:70vh}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.25;margin:0 0 .5em}
h1{font-size:32px} h2{font-size:24px} h3{font-size:19px}
.eyebrow{font-size:12.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--mute);font-weight:600;margin-bottom:6px}
.lead{font-size:18px;color:var(--ink2);max-width:720px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card.link{text-decoration:none;color:inherit;display:block;transition:border-color .15s, transform .15s}
.card.link:hover{border-color:var(--mod);transform:translateY(-1px)}
.mod-card{border-top:4px solid var(--mod)}
.mod-num{font-family:var(--mono);font-size:13px;color:var(--mod);font-weight:500}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--mod);border-radius:3px;transition:width .3s}
.meta{font-size:13.5px;color:var(--mute)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:7px;font-weight:500;font-size:15px;text-decoration:none}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:5px 11px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.crumbs{font-size:14px;color:var(--mute);margin-bottom:14px}
.crumbs a{color:var(--mute)}
.lesson-list{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.lesson-list li a{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink)}
.lesson-list li a:hover{border-color:var(--mod)}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.chk.done{background:var(--ok);border-color:var(--ok)}
.lesson-list .ttl{flex:1;font-weight:500}
article.lesson{max-width:760px}
article.lesson section{margin:30px 0}
article.lesson h2{font-size:22px;padding-top:6px;border-top:1px solid var(--line);padding-top:22px}
.objs{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--mod);border-radius:8px;padding:14px 20px;margin:18px 0}
.objs ul{margin:6px 0 0;padding-left:20px}
.f{font-family:var(--mono);font-size:14.5px;background:var(--accent-soft);border-radius:7px;padding:12px 16px;margin:14px 0;overflow-x:auto;white-space:normal}
.note{font-size:14.5px;color:var(--ink2);background:var(--card);border:1px dashed var(--line);padding:10px 14px;border-radius:7px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px;margin:12px 0;background:var(--card)}
table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--paper);font-weight:600}
table.t td.num, table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:20px}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.ko{background:var(--ko-soft);color:var(--ko)}
.tag.neutral{background:var(--paper);color:var(--ink2);border:1px solid var(--line)}
.keypts{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:20px 24px;margin-top:30px}
.keypts h3{color:var(--paper)}
.keypts ul{margin:0;padding-left:20px}
.lesson-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px}
.q .qn{font-family:var(--mono);font-size:13px;color:var(--mute)}
.q .qt{font-weight:600;margin:4px 0 12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:7px;margin-bottom:8px;cursor:pointer;background:var(--paper)}
.opt input{margin-top:5px}
.opt.sel{border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--ko);background:var(--ko-soft)}
.expl{font-size:14.5px;margin-top:10px;padding:10px 14px;border-radius:7px;background:var(--paper);border-left:3px solid var(--mod)}
.score{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1}
.calc{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:22px;align-items:start}
@media (max-width:760px){.calc{grid-template-columns:1fr} h1{font-size:26px}}
.fld{display:grid;gap:4px;margin-bottom:12px}
.fld label{font-size:13.5px;font-weight:500;color:var(--ink2)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%}
.fld textarea{font-family:var(--mono);font-size:13px;min-height:90px}
.fld .hint{font-size:12.5px;color:var(--mute)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi .k{font-size:12.5px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.kpi .v{font-family:var(--serif);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.kpi .s{font-size:13px;color:var(--ink2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:8px 14px;border-bottom:2px solid transparent;color:var(--ink2);font-weight:500}
.tabs button.on{border-bottom-color:var(--accent);color:var(--ink)}
.status{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.on{background:var(--ok)} .dot.local{background:var(--warn)}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:center;margin-bottom:34px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero-panel{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:22px}
.hero-panel .v{font-family:var(--serif);font-size:38px;font-weight:600}
.svgchart{width:100%;height:auto;display:block}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-size:14.5px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);padding:22px 0;font-size:13px;color:var(--mute)}
/* Présentation */
#pres{position:fixed;inset:0;background:#0f151d;color:#f2efe9;z-index:50;display:none;flex-direction:column}
#pres.open{display:flex}
#pres .ptop{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #2a323d;font-size:14px;color:#a9b0ba}
#pres .ptop .sp{flex:1}
#pres .pbtn{background:#1f2833;border:1px solid #33404f;color:#f2efe9;border-radius:6px;padding:6px 12px;font-size:14px}
#pres .stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:30px}
#pres .slide{max-width:1000px;width:100%;font-size:22px;line-height:1.55}
#pres .slide h1{font-size:44px;color:#fff}
#pres .slide h2{font-size:34px;color:#fff;border-bottom:2px solid #e0a35a;padding-bottom:10px;margin-bottom:22px;display:inline-block}
#pres .slide .f{background:#1f2833;color:#ffe2bd;font-size:20px}
#pres .slide table.t{background:#16202b;font-size:18px}
#pres .slide table.t th{background:#1f2833;color:#fff}
#pres .slide table.t th,#pres .slide table.t td{border-color:#33404f}
#pres .slide .note{background:#16202b;border-color:#33404f;color:#cfd5dc;font-size:17px}
#pres .slide .opt{background:#16202b;border-color:#33404f;color:#f2efe9;cursor:default;font-size:21px}
#pres .slide .opt.right{background:#1d3a2a;border-color:#6cc08e}
#pres .slide .expl{background:#16202b;color:#e9e4da;font-size:18px}
#pres .slide .eyebrow{color:#e0a35a}
#pres .pfoot{height:4px;background:#2a323d}
#pres .pfoot i{display:block;height:100%;background:#e0a35a;transition:width .2s}
.empty{padding:30px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.heat td.cell{text-align:center;font-variant-numeric:tabular-nums;font-weight:500}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#accueil">Risk<span>Académie</span></a>
  <nav class="main" id="nav"></nav>
</div></header>
<main><div class="wrap" id="view"></div></main>
<footer><div class="wrap row" style="justify-content:space-between">
  <span>RiskAcadémie, conçue par <a href="#apropos">Laurent Motais de Narbonne</a>, Risk Manager Senior · <a href="https://www.linkedin.com/in/laurent-motais-de-narbonne/" target="_blank" rel="noopener">LinkedIn</a> · <a href="https://ldenarbonne.github.io/" target="_blank" rel="noopener">Publications</a> · ldenarbonne@googlemail.com<br>Contenu à jour en novembre 2026 ; vérifie les textes réglementaires avant toute décision opérationnelle.</span>
  <span class="status" id="syncStatus"><span class="dot"></span><span>Connexion…</span></span>
</div></footer>
<div id="pres">
  <div class="ptop"><strong id="presTitle" style="color:#fff"></strong><span id="presCount"></span><span class="sp"></span>
    <button class="pbtn" id="presPrev">← Précédent</button><button class="pbtn" id="presNext">Suivant →</button>
    <button class="pbtn" id="presFull">Plein écran</button><button class="pbtn" id="presClose">Quitter (Échap)</button></div>
  <div class="stage"><div class="slide" id="presSlide"></div></div>
  <div class="pfoot"><i id="presBar"></i></div>
</div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="content.js"></script>
<script src="content2.js"></script>
<script src="app.js"></script>
</body>
</html>
